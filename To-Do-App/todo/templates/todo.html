{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDO List</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="signup-login">
        <div>

            <div><h1>Hellow  {{user}}</h1></div>
        <div class="signup-box">


        
            <div class="heading">
                Get Things Done ? </div>
            <div class="ance"><a href="{%url 'signout'%}" class="sign"><i class="fa-solid fa-right-from-bracket"></i></a></div>
            

            <form method="POST">
                {% csrf_token %}
                <input type="text" class="inp" name="title"  required placeholder="Add Today's Task">
                <input type="submit" class="submit-button"
                value="Add Task">

              
            </form>
            {% for todo in res%}
            <div class="Todo">
                <h5>{{todo.sr_no}}</h5>
                <p>{{todo.title}}</p>
                <div>
                    <a href="{% url 'edit_todo' todo.sr_no %}"><i class="fa-solid fa-pen-to-square"></i></a>
                    <a href="{%url 'delete_todo' todo.sr_no %}"><i class="fa-solid fa-trash"></i></a>
                </div>
            </div>

            {% endfor %}
        </div>

        </div>
    </div>
    <script src="https://kit.fontawesome.com/bae2aee053.js" crossorigin="anonymous"></script>
    <script src="{% static 'js/todo.js' %}"></script>
</body>
</html>
